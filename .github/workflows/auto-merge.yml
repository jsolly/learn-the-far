name: Auto-merge

# Arms GitHub native squash auto-merge for non-draft pull requests from
# solly-agent, jsolly, or cursor[bot]. A 30-minute sweep re-arms that setting and, when ci
# and security are already green, squash-merges that head directly.
# Every API call uses AUTO_MERGE_TOKEN. This file never checks out the
# repository, so it cannot run pull request code, and it does not fall back
# to GITHUB_TOKEN. No action is referenced, so there is no third-party SHA
# to pin.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Arm or complete native auto-merge
        env:
          GH_REPO: ${{ github.repository }}
          AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          GH_PROMPT_DISABLED: "1"
          GH_NO_UPDATE_NOTIFIER: "1"
        run: |
          set -euo pipefail

          require_token() {
            if [[ -z "${AUTO_MERGE_TOKEN:-}" ]]; then
              echo "::error::AUTO_MERGE_TOKEN is not configured. Refusing to fall back to GITHUB_TOKEN."
              exit 1
            fi
            export GH_TOKEN="$AUTO_MERGE_TOKEN"
            unset AUTO_MERGE_TOKEN
          }

          pr_url() {
            printf 'https://github.com/%s/pull/%s' "$GH_REPO" "$1"
          }

          # Pull-request events report this bot as cursor[bot]. gh pr view reports
          # the same bot as app/cursor. Dependabot and every other author stay out.
          allowed_author() {
            case "$1" in
              solly-agent|jsolly|cursor\[bot\]|app/cursor) return 0 ;;
              *) return 1 ;;
            esac
          }

          pr_is_eligible() {
            local base=$1
            jq -e --arg repo "$GH_REPO" --arg base "$base" '
              .state == "OPEN"
              and .isDraft == false
              and (.author.login == "solly-agent" or .author.login == "jsolly" or .author.login == "cursor[bot]" or .author.login == "app/cursor")
              and .baseRefName == $base
              and .isCrossRepository == false
              and .headRepository.nameWithOwner == $repo
            ' >/dev/null
          }

          benign_merge_error() {
            printf '%s\n' "$1" | grep -Eiq 'already enabled|already merged|clean status'
          }

          run_merge() {
            local output status
            if output=$("$@" 2>&1); then
              printf '%s\n' "$output"
              return 0
            else
              status=$?
              printf '%s\n' "$output" >&2
              if benign_merge_error "$output"; then
                echo "Treating the existing merge state as success"
                return 0
              fi
              return "$status"
            fi
          }

          arm_auto_merge() {
            local number=$1
            echo "Arming squash auto-merge for pull request #${number}"
            run_merge gh pr merge --auto --squash "$(pr_url "$number")"
          }

          direct_merge() {
            local number=$1 sha=$2
            echo "Squash-merging pull request #${number} at ${sha}"
            run_merge gh pr merge --squash --match-head-commit "$sha" "$(pr_url "$number")"
          }

          view_pr() {
            gh pr view "$1" --json number,state,isDraft,author,baseRefName,headRefOid,headRepository,isCrossRepository,autoMergeRequest
          }

          check_success() {
            local sha=$1 name=$2 workflow payload run_id jobs total count status conclusion line
            case "$name" in
              ci) workflow=ci.yml ;;
              security) workflow=security.yml ;;
              *) return 2 ;;
            esac
            if ! payload=$(gh api "repos/${GH_REPO}/actions/workflows/${workflow}/runs?head_sha=${sha}&per_page=100"); then
              return 2
            fi
            run_id=$(jq -r --arg sha "$sha" --arg repo "$GH_REPO" '
              [.workflow_runs[]
                | select(.head_sha == $sha
                    and (.head_repository.full_name // "") == $repo
                    and (.repository.full_name // "") == $repo)]
              | sort_by(.id)
              | if length == 0 then ""
                else .[-1]
                  | if .status == "completed" and .conclusion == "success" then (.id | tostring)
                    else "not-green"
                    end
                end
            ' <<<"$payload") || return 2
            [[ "$run_id" =~ ^[0-9]+$ ]] || return 1
            if ! jobs=$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100"); then
              return 2
            fi
            total=$(jq -r '.total_count' <<<"$jobs") || return 2
            count=$(jq -r '.jobs | length' <<<"$jobs") || return 2
            [[ "$total" =~ ^[0-9]+$ && "$count" =~ ^[0-9]+$ && "$total" == "$count" ]] || return 2
            line=$(jq -r --arg name "$name" '
              [.jobs[] | select(.name == $name)]
              | sort_by(.id)
              | if length == 0 then "missing missing"
                else "\(.[-1].status) \(.[-1].conclusion // "none")"
                end
            ' <<<"$jobs") || return 2
            read -r status conclusion <<<"$line" || return 2
            [[ "$status" == "completed" && "$conclusion" == "success" ]]
          }

          checks_green() {
            local sha=$1 result
            check_success "$sha" ci
            result=$?
            [[ "$result" -eq 0 ]] || return "$result"
            check_success "$sha" security
          }

          sweep_one() {
            local number=$1 base=$2 pr sha armed green
            set -e
            pr=$(view_pr "$number")
            if ! pr_is_eligible "$base" <<<"$pr"; then
              echo "Skipping pull request #${number}"
              return 0
            fi
            sha=$(jq -r '.headRefOid' <<<"$pr")
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Pull request #${number} has no full head SHA"
              return 1
            }
            set +e
            checks_green "$sha"
            green=$?
            set -e
            if [[ "$green" -eq 2 ]]; then
              echo "::error::Could not read ci or security for pull request #${number}"
              return 1
            fi
            if [[ "$green" -eq 0 ]]; then
              pr=$(view_pr "$number")
              if ! pr_is_eligible "$base" <<<"$pr"; then
                echo "Pull request #${number} changed before merge; leaving it"
                return 0
              fi
              if [[ "$(jq -r '.headRefOid' <<<"$pr")" != "$sha" ]]; then
                echo "Pull request #${number} moved after the check read; re-arming instead"
                arm_auto_merge "$number"
                return
              fi
              direct_merge "$number" "$sha"
              return
            fi
            armed=$(jq -r '.autoMergeRequest != null' <<<"$pr")
            if [[ "$armed" == "true" ]]; then
              echo "Pull request #${number} already has auto-merge armed"
              return 0
            fi
            arm_auto_merge "$number"
          }

          [[ "$GH_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::Unexpected repository name"
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            number=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
            login=$(jq -r '.pull_request.user.login // empty' "$GITHUB_EVENT_PATH")
            draft=$(jq -r '.pull_request.draft' "$GITHUB_EVENT_PATH")
            head_repo=$(jq -r '.pull_request.head.repo.full_name // empty' "$GITHUB_EVENT_PATH")
            base_repo=$(jq -r '.pull_request.base.repo.full_name // empty' "$GITHUB_EVENT_PATH")
            base_ref=$(jq -r '.pull_request.base.ref // empty' "$GITHUB_EVENT_PATH")
            default_ref=$(jq -r '.repository.default_branch // empty' "$GITHUB_EVENT_PATH")
            [[ "$number" =~ ^[0-9]+$ ]] || {
              echo "::error::Pull request event has no numeric number"
              exit 1
            }
            if [[ "$draft" != "false" ]] || ! allowed_author "$login" || [[ "$head_repo" != "$base_repo" || "$base_repo" != "$GH_REPO" || "$base_ref" != "$default_ref" || -z "$default_ref" ]]; then
              echo "Not arming auto-merge for pull request #${number}"
              exit 0
            fi
            require_token
            pr=$(view_pr "$number")
            if ! pr_is_eligible "$default_ref" <<<"$pr"; then
              echo "Pull request #${number} is no longer eligible"
              exit 0
            fi
            arm_auto_merge "$number"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" != "schedule" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::Unexpected event ${GITHUB_EVENT_NAME}"
            exit 1
          fi

          require_token
          default_branch=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          [[ "$default_branch" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "::error::Unexpected default branch"
            exit 1
          }
          list=$(gh pr list --state open --base "$default_branch" --limit 200 --json number --jq '.[].number')
          count=0
          if [[ -n "$list" ]]; then
            count=$(printf '%s\n' "$list" | wc -l)
            count=${count//[[:space:]]/}
          fi
          if [[ "$count" -eq 200 ]]; then
            echo "::error::Refusing to sweep a truncated list of 200 open pull requests"
            exit 1
          fi
          failures=0
          while IFS= read -r number; do
            [[ -n "$number" ]] || continue
            [[ "$number" =~ ^[0-9]+$ ]] || {
              echo "::error::Invalid pull request number in the open list"
              failures=1
              continue
            }
            set +e
            (sweep_one "$number" "$default_branch")
            status=$?
            set -e
            if [[ "$status" -ne 0 ]]; then
              echo "::error::Auto-merge sweep failed for pull request #${number}"
              failures=1
            fi
          done <<<"$list"
          exit "$failures"
