
# mise.lock pins each tool's download URL and checksum per platform, so installs need no GitHub API
# release lookup (proxied cloud sessions refuse that API). To bump a pin, edit it here, run
# `mise lock`, and commit both files.
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[tools]
node = "26"
gitleaks = "8.24.2"
uv = "0.12.22"
jq = "1.8.2"
